# /etc/ssh/sshd_config.d/10-tunnel.conf on the VPS
# The "10-" prefix makes this file load before 50-cloud-init.conf.
# sshd uses the first value it reads for each setting.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
ClientAliveInterval 30
ClientAliveCountMax 3

Match User tunnel
    AllowTcpForwarding remote
    # Port-only form. "127.0.0.1:8080" would NOT match "ssh -R 8080:..."
    PermitListen 8080 8081 8082
    PermitTTY no
    ForceCommand /usr/sbin/nologin
