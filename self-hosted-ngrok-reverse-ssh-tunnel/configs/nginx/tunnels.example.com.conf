# /etc/nginx/sites-available/tunnels.example.com
# One wildcard server block for every app (Option 2).
# Needs a *.example.com DNS record and a wildcard certificate (DNS-01).

# One port per subdomain. Add a line here for each new app.
map $host $tunnel_port {
    app.example.com      8080;
    grafana.example.com  8081;
    shop.example.com     8082;
    default              0;
}

# Optional login per subdomain. "off" means no password prompt.
map $host $tunnel_auth {
    grafana.example.com  "Restricted";
    default              off;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.com *.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    if ($tunnel_port = 0) {
        return 404;
    }

    auth_basic           $tunnel_auth;
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:$tunnel_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
