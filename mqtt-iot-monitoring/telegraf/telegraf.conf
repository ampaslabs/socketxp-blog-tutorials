[agent]
  interval = "10s"
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "iot"
  bucket = "telemetry"

# 1. Device telemetry: fleet/{site}/{device_id}/telemetry  (JSON)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["fleet/+/+/telemetry"]
  qos = 0
  client_id = "telegraf-telemetry"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  data_format = "json"
  tag_keys = ["fw"]
  json_string_fields = ["model_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "fleet/+/+/telemetry"
    measurement = "_/_/_/measurement"
    tags = "_/site/device_id/_"

# 2. Online/offline status (retained, plain string payload)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["fleet/+/+/status"]
  qos = 1
  client_id = "telegraf-status"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "fleet/+/+/status"
    measurement = "_/_/_/measurement"
    tags = "_/site/device_id/_"

# Map "online"/"offline" to 1/0 so Grafana can plot it
[[processors.enum]]
  namepass = ["status"]
  [[processors.enum.mapping]]
    field = "value"
    dest = "up"
    [processors.enum.mapping.value_mappings]
      online = 1
      offline = 0

# 3. Device events, e.g. ESP32 boot events with the reset reason
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["fleet/+/+/event"]
  qos = 0
  client_id = "telegraf-events"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  data_format = "json"
  tag_keys = ["event", "reset_reason", "fw"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "fleet/+/+/event"
    measurement = "_/_/_/measurement"
    tags = "_/site/device_id/_"

# 4. Broker health from Mosquitto $SYS topics (one numeric value per topic)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "$SYS/broker/clients/connected",
    "$SYS/broker/subscriptions/count",
    "$SYS/broker/load/messages/received/1min",
    "$SYS/broker/load/messages/sent/1min",
  ]
  client_id = "telegraf-sys"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  name_override = "mosquitto"
  data_format = "value"
  data_type = "float"
